name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python vision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "apps/vision[dev]"
      - name: Lint
        run: ruff check apps/vision
      - name: Test
        run: pytest apps/vision/tests

  go:
    name: Go server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: platewatch_test
          POSTGRES_USER: platewatch
          POSTGRES_PASSWORD: platewatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platewatch -d platewatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://platewatch:platewatch_test@127.0.0.1:5432/platewatch_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Resolve Go modules
        run: |
          go mod tidy
          echo "GO_MOD_BEGIN"
          cat go.mod
          echo "GO_MOD_END"
          echo "GO_SUM_BEGIN"
          cat go.sum
          echo "GO_SUM_END"
      - name: Format check
        run: |
          unformatted="$(gofmt -l .)"
          echo "$unformatted"
          test -z "$unformatted"
      - name: Test
        run: go test ./...

  web:
    name: React web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
