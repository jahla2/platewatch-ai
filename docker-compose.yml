services:
  model-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu;
        if [ ! -s /models/yolo11n.pt ]; then
          echo "Downloading vehicle detector...";
          curl -fL "$${PLATEWATCH_VEHICLE_MODEL_URL}" -o /models/yolo11n.pt.tmp;
          mv /models/yolo11n.pt.tmp /models/yolo11n.pt;
        fi;
        if [ ! -s /models/license_plate.pt ]; then
          echo "Downloading license-plate detector...";
          curl -fL "$${PLATEWATCH_PLATE_MODEL_URL}" -o /models/license_plate.pt.tmp;
          mv /models/license_plate.pt.tmp /models/license_plate.pt;
        fi
    environment:
      PLATEWATCH_VEHICLE_MODEL_URL: ${PLATEWATCH_VEHICLE_MODEL_URL}
      PLATEWATCH_PLATE_MODEL_URL: ${PLATEWATCH_PLATE_MODEL_URL}
    volumes:
      - platewatch_models:/models
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platewatch}
      POSTGRES_USER: ${POSTGRES_USER:-platewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - platewatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platewatch} -d ${POSTGRES_DB:-platewatch}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build:
      context: ./apps/server
    environment:
      PLATEWATCH_SERVER_PORT: "8080"
      PLATEWATCH_FLAGGED_PLATES: ${PLATEWATCH_FLAGGED_PLATES:-}
      PLATEWATCH_WEB_ORIGIN: ${PLATEWATCH_WEB_ORIGIN:-http://localhost:3000}
      PLATEWATCH_INTERNAL_TOKEN: ${PLATEWATCH_INTERNAL_TOKEN}
      PLATEWATCH_ADMIN_TOKEN: ${PLATEWATCH_ADMIN_TOKEN}
      PLATEWATCH_API_TIMEOUT_SECONDS: ${PLATEWATCH_API_TIMEOUT_SECONDS:-5}
      PLATEWATCH_RATE_LIMIT_PUBLIC_RPM: ${PLATEWATCH_RATE_LIMIT_PUBLIC_RPM:-120}
      PLATEWATCH_RATE_LIMIT_INTERNAL_RPM: ${PLATEWATCH_RATE_LIMIT_INTERNAL_RPM:-1200}
      PLATEWATCH_RATE_LIMIT_ADMIN_RPM: ${PLATEWATCH_RATE_LIMIT_ADMIN_RPM:-60}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  vision:
    build:
      context: ./apps/vision
    environment:
      PLATEWATCH_SERVER_URL: http://server:8080
      PLATEWATCH_INTERNAL_TOKEN: ${PLATEWATCH_INTERNAL_TOKEN}
      PLATEWATCH_VISION_AUTO_START: ${PLATEWATCH_VISION_AUTO_START:-false}
      PLATEWATCH_CAMERA_ID: ${PLATEWATCH_CAMERA_ID:-CAM-01}
      PLATEWATCH_VISION_SOURCE: ${PLATEWATCH_VISION_SOURCE:-0}
      PLATEWATCH_VEHICLE_MODEL: /models/yolo11n.pt
      PLATEWATCH_VEHICLE_CONFIDENCE: ${PLATEWATCH_VEHICLE_CONFIDENCE:-0.35}
      PLATEWATCH_PLATE_MODEL: /models/license_plate.pt
      PLATEWATCH_PLATE_CONFIDENCE: ${PLATEWATCH_PLATE_CONFIDENCE:-0.50}
      PLATEWATCH_VISION_IMAGE_SIZE: ${PLATEWATCH_VISION_IMAGE_SIZE:-640}
      PLATEWATCH_VISION_DEVICE: ${PLATEWATCH_VISION_DEVICE:-}
      PLATEWATCH_INFERENCE_STRIDE: ${PLATEWATCH_INFERENCE_STRIDE:-2}
      PLATEWATCH_TRACK_IOU_THRESHOLD: ${PLATEWATCH_TRACK_IOU_THRESHOLD:-0.30}
      PLATEWATCH_TRACK_MAX_MISSES: ${PLATEWATCH_TRACK_MAX_MISSES:-8}
      PLATEWATCH_OCR_ENGINE: ${PLATEWATCH_OCR_ENGINE:-paddleocr}
      PLATEWATCH_OCR_LANG: ${PLATEWATCH_OCR_LANG:-en}
      PLATEWATCH_OCR_MIN_CONFIDENCE: ${PLATEWATCH_OCR_MIN_CONFIDENCE:-0.70}
      PLATEWATCH_OCR_CONFIRMATION_COUNT: ${PLATEWATCH_OCR_CONFIRMATION_COUNT:-3}
      PLATEWATCH_OCR_INTERVAL_FRAMES: ${PLATEWATCH_OCR_INTERVAL_FRAMES:-3}
      PLATEWATCH_PLATE_MIN_QUALITY: ${PLATEWATCH_PLATE_MIN_QUALITY:-0.35}
      PLATEWATCH_PUBLISH_TIMEOUT_SECONDS: ${PLATEWATCH_PUBLISH_TIMEOUT_SECONDS:-2.0}
      PLATEWATCH_PUBLISH_MAX_ATTEMPTS: ${PLATEWATCH_PUBLISH_MAX_ATTEMPTS:-3}
      PLATEWATCH_PUBLISH_BACKOFF_SECONDS: ${PLATEWATCH_PUBLISH_BACKOFF_SECONDS:-0.25}
      PLATEWATCH_EVIDENCE_DIR: /evidence
      PLATEWATCH_EVIDENCE_URL_PREFIX: /evidence
    expose:
      - "8000"
    volumes:
      - platewatch_models:/models:ro
      - platewatch_evidence:/evidence
    depends_on:
      model-init:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${PLATEWATCH_WEB_PORT:-3000}:80"
    volumes:
      - platewatch_evidence:/usr/share/nginx/evidence:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  platewatch_postgres:
  platewatch_models:
  platewatch_evidence:
